# products.aiknol.com
#
# Appended to /opt/knol/Caddyfile by deploy.sh, between the markers below.
# Everything inside is idempotent — the deploy replaces the whole block.
#
# >>> products.aiknol.com >>>
products.aiknol.com {
	encode zstd gzip

	reverse_proxy products-site:80

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy strict-origin-when-cross-origin
		Cross-Origin-Opener-Policy same-origin
		Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
		# style-src carries 'unsafe-inline' because each product page sets its
		# accent through a one-line <style> and the cards carry a --accent
		# custom property in a style attribute. script-src does not, and must
		# not: every script on the site is an external file.
		# The two Google Fonts hosts are the only third parties the page talks
		# to; connect-src stays 'self' so nothing can exfiltrate from here.
		Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
		-Server
	}

	log {
		output stdout
		format json
		level INFO
	}
}
# <<< products.aiknol.com <<<
